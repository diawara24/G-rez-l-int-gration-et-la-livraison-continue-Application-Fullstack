name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Tests Angular et Spring Boot
    runs-on: ubuntu-latest

    env:
      FRONTEND_DIR: frontend
      BACKEND_DIR: backend

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installer les dépendances Angular
        run: npm ci
        working-directory: ${{ env.FRONTEND_DIR }}

      - name: Exécuter les tests et générer les rapports JUnit
        run: bash script/run-tests.sh

      - name: Publier les résultats de tests dans GitHub
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: Résultats des tests
          path: test-results/junit/**/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Conserver les rapports JUnit comme artefacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapports-junit
          path: test-results/junit/**/*.xml
          if-no-files-found: warn
  build:
    name: Construire et publier l'image ${{ matrix.app }}
    needs: test
    runs-on: ubuntu-latest

    # GITHUB_TOKEN reçoit uniquement les droits nécessaires à ce job.
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - app: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - app: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Sur une pull request, on construit l'image pour vérifier le Dockerfile,
      # mais on ne se connecte pas au registre et on ne publie rien.
      - name: Connexion à GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer les tags et labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Construire et publier l'image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
